#########################
# Mail (send-diagnostics-to-Gmail feature)
#########################
# Populate MAIL_USERNAME / MAIL_PASSWORD via backend/.env (see .env.example).
# MAIL_USERNAME is the sending Gmail address and MAIL_PASSWORD must be a
# 16-character Google App Password (not the account login password) —
# https://myaccount.google.com/apppasswords (requires 2-Step Verification enabled).
#
# If this hangs/resets ("Connection reset by peer") even with a correct App
# Password, it's almost always local antivirus mail-scanning or a network/ISP
# SMTP block, not a config problem — see the chat notes on troubleshooting.
# spring.mail.properties.mail.debug=true prints the full SMTP conversation to
# the console, which is the fastest way to see exactly where it breaks.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
